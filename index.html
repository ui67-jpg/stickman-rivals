<canvas id='game'></canvas>
<div id='menu'><div id='card'><h1>BRICK LASER RIVALS V6.1</h1><p>Fixed iPad renderer • laser-tag FPS</p>

<div class='item'><h2>FAST AI DUEL</h2><p>Visible arena, moving AI, joystick, laser beams, scope, jump and recharge.</p><button onclick='startGame()'>PLAY LASER TAG</button></div></div>

<div id='touch'><div id='joyBase'><div id='joyStick'></div></div><button class='t' id='jump'>JUMP</button><button class='t' id='scopeBtn'>SCOPE</button><button class='t' id='charge'>CHARGE</button><button class='t' id='fire'>FIRE</button></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W,H,D=Math.min(devicePixelRatio||1,2);function resize(){W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const maps=[['Neon Maze',["1111111111111111","1000000000000001","1011110011110101","1000010000010001","1110010111011101","1000010001000001","1011111101011101","1000000101000001","1011100101111101","1000100000000001","1110101111110101","1000001000010001","1011101011011101","1000000010000001","1000000000000001","1111111111111111"]],

['Reactor Hall',["1111111111111111","1000000000000001","1001110001110001","1001010001010001","1001010001010001","1000000000000001","1110001110001111","1000000000000001","1001110001110001","1001010001010001","1001010001010001","1000000000000001","1110001110001111","1000000000000001","1000000000000001","1111111111111111"]],
['Championship Arena',["1111111111111111","1000000000000001","1001110001110001","1001010001010001","1000000000000001","1110001110001111","1000000000000001","1000110001100001","1000110001100001","1000000000000001","1110001110001111","1000000000000001","1001010001010001","1001110001110001","1000000000000001","1111111111111111"]]];
const weapons=[['Pulse Blaster','rapid',0,10,10,30,120,'Balanced rapid fire'],['Phaser','semi',0,18,4,16,80,'Accurate semi-auto'],['Burst Beam','burst',250,13,7,24,120,'Three-shot burst'],['Rapid Spark','rapid',350,7,16,40,180,'Very fast fire'],['Scatter Laser','scatter',450,7,2.4,8,48,'Wide multi-beam'],['Precision Beam','precision',600,42,1.3,6,36,'Scoped long range'],['Heavy Photon','heavy',750,28,3,12,60,'Powerful beam'],['Charge Cannon','charge',900,58,.8,4,24,'Huge energy shot'],['Laser Carbine','rapid',700,12,9,28,140,'Accurate rapid fire'],['Photon SMG','rapid',850,8,18,42,210,'Extreme fire rate'],['Longshot Laser','precision',1300,52,1,5,30,'Long-range scope'],['Hyper Pulse','rapid',1700,10,21,50,250,'Ultra-fast fire']];
let map=0,team='blue',credits=+(localStorage.v61c||1500),unlocked=JSON.parse(localStorage.v61u||'["Pulse Blaster","Phaser"]'),loadout=JSON.parse(localStorage.v61l||'["Pulse Blaster","Phaser"]');
function save(){localStorage.v61c=credits;localStorage.v61u=JSON.stringify(unlocked);localStorage.v61l=JSON.stringify(loadout)}function showTab(n){['play','maps','shop','load'].forEach(x=>document.getElementById(x+'Tab').style.display=x===n?'block':'none');if(n==='maps')renderMaps();if(n==='shop'||n==='load')renderShop()}function setTeam(t){team=t;teamText.textContent=t.toUpperCase()}
function renderMaps(){mapsGrid.innerHTML='';maps.forEach((m,i)=>{let d=document.createElement('div');d.className='item '+(i===map?'sel':'');d.innerHTML='<b>'+(i+1)+'. '+m[0]+'</b>';d.onclick=()=>{map=i;renderMaps()};mapsGrid.appendChild(d)})}
function renderShop(){creditsText.textContent=credits;shopGrid.innerHTML='';loadGrid.innerHTML='';weapons.forEach(w=>{let own=unlocked.includes(w[0]),d=document.createElement('div');d.className='item';d.innerHTML='<b>'+w[0]+'</b><div class=small>'+w[7]+'</div><div class=price>'+(own?'UNLOCKED':w[2]+' credits')+'</div>';d.onclick=()=>{if(!own&&credits>=w[2]){credits-=w[2];unlocked.push(w[0]);save();renderShop()}};shopGrid.appendChild(d);if(own){let q=d.cloneNode(true);q.className='item '+(loadout.includes(w[0])?'sel':'');q.onclick=()=>{if(loadout.includes(w[0])){if(loadout.length>1)loadout=loadout.filter(x=>x!==w[0])}else if(loadout.length<5)loadout.push(w[0]);save();renderShop()};loadGrid.appendChild(q)}})}renderMaps();renderShop();
let playing=false,keys={},joy={x:0,y:0},last=0,round=120,you=0,ais=0,scopeOn=false,fireHeld=false,slot=0,lastShot=0;
let P={x:2.5,y:2.5,a:.15,pitch:0,z:0,vz:0,hp:100},A={x:13.2,y:13.2,a:3.2,hp:100,weapon:null,cool:0,strafe:1},S={ammo:30,res:120,recharge:0,recoil:0},beams=[];
const getW=n=>weapons.find(w=>w[0]===n)||weapons[0],grid=()=>maps[map][1];function cell(x,y){let g=grid(),ix=Math.floor(x),iy=Math.floor(y);if(ix<0||iy<0||iy>=g.length||ix>=g[0].length)return'1';return g[iy][ix]}function wall(x,y){return cell(x,y)==='1'}function move(o,dx,dy){if(!wall(o.x+dx,o.y))o.x+=dx;if(!wall(o.x,o.y+dy))o.y+=dy}function tc(){return team==='red'?'#ff5353':team==='green'?'#5be16a':team==='yellow'?'#ffe35a':'#4b9fff'}
function aiSpawn(){A={x:13.2,y:13.2,a:3.2,hp:100,weapon:weapons[Math.floor(Math.random()*8)],cool:.2,strafe:Math.random()>.5?1:-1};flash('AI: '+A.weapon[0].toUpperCase())}function startGame(){playing=true;menu.style.display='none';hud.style.display='block';P={x:2.5,y:2.5,a:.15,pitch:0,z:0,vz:0,hp:100};you=ais=0;round=120;aiSpawn();equip(0);mapName.textContent=maps[map][0];last=performance.now();requestAnimationFrame(loop)}function endGame(){playing=false;hud.style.display='none';menu.style.display='flex'}
function equip(i){if(!loadout[i])return;slot=i;let w=getW(loadout[i]);S={ammo:w[5],res:w[6],recharge:0,recoil:0};scopeOn=false;bar();ui()}function bar(){wepbar.innerHTML='';loadout.forEach((n,i)=>{let b=document.createElement('button');b.className='wbtn '+(i===slot?'active':'');b.innerHTML=(i+1)+'<br>'+n;b.onclick=()=>equip(i);wepbar.appendChild(b)})}
function jump(){if(P.z<=0)P.vz=5.7}function recharge(){let w=getW(loadout[slot]);if(S.recharge||S.ammo>=w[5]||S.res<=0)return;S.recharge=.75;flash('RECHARGING')}
function updP(dt){let f=((keys.w||keys.ArrowUp)?1:0)-((keys.s||keys.ArrowDown)?1:0)-joy.y,s=((keys.d||keys.ArrowRight)?1:0)-((keys.a||keys.ArrowLeft)?1:0)+joy.x,m=Math.hypot(f,s);if(m>1){f/=m;s/=m}let sp=4.7;move(P,(Math.cos(P.a)*f+Math.cos(P.a+Math.PI/2)*s)*sp*dt,(Math.sin(P.a)*f+Math.sin(P.a+Math.PI/2)*s)*sp*dt);P.vz-=11*dt;P.z+=P.vz*dt;if(P.z<0){P.z=0;P.vz=0}if(S.recharge>0){S.recharge-=dt;if(S.recharge<=0){let w=getW(loadout[slot]),n=Math.min(w[5]-S.ammo,S.res);S.ammo+=n;S.res-=n}}S.recoil=Math.max(0,S.recoil-dt*6);if(fireHeld)shoot(false)}
function norm(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a}function clear(x1,y1,x2,y2){let d=Math.hypot(x2-x1,y2-y1),n=Math.ceil(d*12);for(let i=1;i<n;i++){let t=i/n;if(wall(x1+(x2-x1)*t,y1+(y2-y1)*t))return false}return true}
function shoot(ai=false){let now=performance.now()/1000,src=ai?A:P,w=ai?A.weapon:getW(loadout[slot]);if(ai){if(A.cool>0)return;A.cool=1/Math.max(.2,w[4])}else{if(now-lastShot<1/Math.max(.2,w[4])||S.recharge>0)return;if(S.ammo<=0){recharge();return}lastShot=now;S.ammo--;S.recoil=.55}let t=ai?P:A,dx=t.x-src.x,dy=t.y-src.y,d=Math.hypot(dx,dy),aim=Math.atan2(dy,dx),shots=w[1]==='scatter'?6:w[1]==='burst'?3:1;for(let i=0;i<shots;i++){let a=(ai?aim:src.a)+(Math.random()-.5)*(w[1]==='scatter'?.15:.035);beams.push({a,life:.12,c:ai?'#ff5353':tc()});if(clear(src.x,src.y,t.x,t.y)&&Math.abs(norm(aim-a))<(w[1]==='scatter'?.14:.06)&&d<(w[1]==='scatter'?5.5:14)){t.hp-=w[3]*(w[1]==='scatter'?.42:1)}}if(P.hp<=0){ais++;P.hp=100;P.x=2.5;P.y=2.5;flash('AI TAGGED YOU')}if(A.hp<=0){you++;credits+=80;save();aiSpawn();flash('+80 CREDITS')}ui()}
function updAI(dt){A.cool=Math.max(0,A.cool-dt);let dx=P.x-A.x,dy=P.y-A.y,d=Math.hypot(dx,dy),aim=Math.atan2(dy,dx);A.a+=norm(aim-A.a)*Math.min(1,dt*3.4);let desired=A.weapon[1]==='scatter'?3.5:A.weapon[1]==='precision'?9:6.5;if(d>desired+1)move(A,Math.cos(aim)*2.5*dt,Math.sin(aim)*2.5*dt);else if(d<desired-1)move(A,-Math.cos(aim)*2.2*dt,-Math.sin(aim)*2.2*dt);move(A,Math.cos(aim+Math.PI/2)*A.strafe*1.5*dt,Math.sin(aim+Math.PI/2)*A.strafe*1.5*dt);if(Math.random()<.01)A.strafe*=-1;if(clear(A.x,A.y,P.x,P.y)&&d<13)shoot(true)}
function ui(){hpText.textContent=Math.max(0,Math.ceil(P.hp));hpFill.style.width=Math.max(0,P.hp)+'%';let w=getW(loadout[slot]);weaponName.textContent=w[0].toUpperCase();energyText.textContent=S.ammo+' / '+S.res;abilityText.textContent=w[7];youScore.textContent=you;aiScore.textContent=ais;scope.style.display=scopeOn?'block':'none'}function flash(t){msg.textContent=t;msg.style.opacity=1;clearTimeout(flash.t);flash.t=setTimeout(()=>msg.style.opacity=0,850)}
function cast(a){let d=0;for(let i=0;i<350;i++){d+=.035;if(wall(P.x+Math.cos(a)*d,P.y+Math.sin(a)*d))break}return d}function proj(x,y){let dx=x-P.x,dy=y-P.y,d=Math.hypot(dx,dy),a=norm(Math.atan2(dy,dx)-P.a);if(Math.abs(a)>.75)return null;return{x:W/2+a/(Math.PI/6)*W/2,d,s:Math.min(H,H/(d*.7)),y:H/2+P.pitch*H*.25-P.z*30}}
function render(){let hor=H/2+P.pitch*H*.25-P.z*30;ctx.fillStyle='#0a1726';ctx.fillRect(0,0,W,hor);ctx.fillStyle='#0d2130';ctx.fillRect(0,hor,W,H-hor);let rays=Math.min(420,Math.floor(W/2)),cw=W/rays;for(let i=0;i<rays;i++){let ca=(i/(rays-1)-.5)*(Math.PI/3),d=cast(P.a+ca)*Math.cos(ca),wh=Math.min(H*1.5,H/(d*.75)),y=hor-wh/2,sh=Math.max(.2,1-d/16);ctx.fillStyle=`rgba(28,79,108,${.25+.7*sh})`;ctx.fillRect(i*cw,y,cw+1,wh);ctx.fillStyle=tc();ctx.globalAlpha=.08+.14*sh;ctx.fillRect(i*cw,y,cw+1,Math.max(2,wh*.025));ctx.globalAlpha=1}let ap=proj(A.x,A.y);if(ap&&clear(P.x,P.y,A.x,A.y)){let s=ap.s*.58;ctx.fillStyle='#f0ca4b';ctx.fillRect(ap.x-s*.17,ap.y-s*.63,s*.34,s*.24);ctx.fillStyle='#182536';ctx.fillRect(ap.x-s*.25,ap.y-s*.37,s*.5,s*.43);ctx.strokeStyle='#ff5353';ctx.lineWidth=Math.max(2,s*.025);ctx.strokeRect(ap.x-s*.24,ap.y-s*.36,s*.48,s*.41);ctx.fillStyle='#25384b';ctx.fillRect(ap.x+s*.13,ap.y-s*.25,s*.5,s*.11)}for(const b of beams){let ex=W/2+norm(b.a-P.a)/(Math.PI/6)*W/2;ctx.strokeStyle=b.c;ctx.shadowColor=b.c;ctx.shadowBlur=14;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(W/2,H*.57);ctx.lineTo(ex,H*.47);ctx.stroke();ctx.shadowBlur=0}ctx.save();ctx.translate(W*.67,H*.8+S.recoil*16);let sc=Math.min(W,H)/700;ctx.scale(sc,sc);ctx.fillStyle='#293b4c';ctx.fillRect(-60,-22,220,42);ctx.fillStyle='#111b25';ctx.fillRect(95,-34,105,24);ctx.fillStyle='#566f7f';ctx.fillRect(-8,16,36,78);ctx.fillStyle=tc();ctx.shadowColor=tc();ctx.shadowBlur=18;ctx.fillRect(145,-14,60,16);ctx.restore()}
function loop(t){if(!playing)return;let dt=Math.min(.033,(t-last)/1000);last=t;round-=dt;if(round<=0){round=120;you=ais=0}updP(dt);updAI(dt);for(let i=beams.length-1;i>=0;i--){beams[i].life-=dt;if(beams[i].life<=0)beams.splice(i,1)}timer.textContent=Math.ceil(round);ui();render();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key===' ')jump();if(e.key.toLowerCase()==='r')recharge();if(e.key.toLowerCase()==='q'){scopeOn=!scopeOn;ui()}if('12345'.includes(e.key))equip(+e.key-1)});addEventListener('keyup',e=>keys[e.key]=0);canvas.addEventListener('mousedown',e=>{if(e.button===2){scopeOn=!scopeOn;ui()}else fireHeld=true});addEventListener('mouseup',()=>fireHeld=false);canvas.oncontextmenu=e=>e.preventDefault();canvas.addEventListener('mousemove',e=>{if(playing&&document.pointerLockElement===canvas){P.a+=e.movementX*.003;P.pitch=Math.max(-.5,Math.min(.5,P.pitch-e.movementY*.0022))}});canvas.addEventListener('click',()=>{if(playing&&matchMedia('(pointer:fine)').matches)canvas.requestPointerLock?.()});
let aim=null,lx=0,ly=0;canvas.addEventListener('touchstart',e=>{for(const t of e.changedTouches)if(playing&&t.clientX>W*.43&&aim===null){aim=t.identifier;lx=t.clientX;ly=t.clientY}},{passive:false});canvas.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===aim){P.a+=(t.clientX-lx)*.008;P.pitch=Math.max(-.5,Math.min(.5,P.pitch-(t.clientY-ly)*.0045));lx=t.clientX;ly=t.clientY}},{passive:false});canvas.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(t.identifier===aim)aim=null});
let jp=null;function setJoy(x,y){let r=joyBase.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=x-cx,dy=y-cy,m=44,d=Math.hypot(dx,dy);if(d>m){dx=dx/d*m;dy=dy/d*m}joy.x=dx/m;joy.y=dy/m;joyStick.style.transform=`translate(${dx}px,${dy}px)`}function resetJoy(){joy.x=joy.y=0;joyStick.style.transform='translate(0,0)';jp=null}joyBase.addEventListener('pointerdown',e=>{jp=e.pointerId;setJoy(e.clientX,e.clientY)});joyBase.addEventListener('pointermove',e=>{if(e.pointerId===jp)setJoy(e.clientX,e.clientY)});['pointerup','pointercancel','pointerleave'].forEach(ev=>joyBase.addEventListener(ev,resetJoy));document.getElementById('jump').onclick=jump;document.getElementById('charge').onclick=recharge;document.getElementById('scopeBtn').onclick=()=>{scopeOn=!scopeOn;ui()};fire.addEventListener('pointerdown',()=>fireHeld=true);['pointerup','pointercancel','pointerleave'].forEach(ev=>fire.addEventListener(ev,()=>fireHeld=false));showTab('play');
